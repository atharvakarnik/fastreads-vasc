<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FastReads VASC</title>

  <!-- Prevent favicon.ico 404 -->
  <link rel="icon" href="data:,">

  <style>
    :root { --panelW: 420px; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; height:100vh; display:flex; background:#0b1220; color:#e6edf7; }
    #left { width: var(--panelW); padding:14px; box-sizing:border-box; border-right:1px solid rgba(255,255,255,0.08); background:#0f1a33; overflow:auto; }
    #viewerWrap { flex:1; display:flex; flex-direction:column; min-width: 0; }
    #topBar { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:10px; background:#0f1a33; }
    #gl { flex:1; min-height: 0; position:relative; overflow:hidden; }
    canvas { width:100% !important; height:100% !important; display:block; background:#000; }
    .viewerCanvas { position:absolute; inset:0; z-index:0; }
    .toolOverlay { position:absolute; inset:0; z-index:1; background:transparent; pointer-events:none; touch-action:none; }

    .row { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; align-items:center; }
    button, input, select { border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:#13224a; color:#e6edf7; padding:10px 12px; }
    button { cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    input[type="text"] { flex:1; min-width: 110px; }
    input[type="range"] { width:100%; padding:0; }

    textarea { width:100%; height: 24vh; resize: vertical; border-radius:12px; border:1px solid rgba(255,255,255,0.15); background:#0b1430; color:#e6edf7; padding:10px; box-sizing:border-box; }

    .label { font-size:12px; opacity:0.8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chip { font-size:12px; padding:4px 8px; border-radius:999px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); }
    .status { font-size:12px; opacity:0.85; line-height:1.35; }
    .hr { height:1px; background:rgba(255,255,255,0.08); margin:12px 0; }
    .rangeGrid { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap:8px; margin-top:6px; align-items:end; }
    .rangeField { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .rangeField span { font-size:12px; opacity:0.9; }
    .rangeField input[type="number"] { width:100%; box-sizing:border-box; }
    .wlGrid { display:grid; grid-template-columns: minmax(0, 1fr); gap:10px; margin-top:12px; }
    .sliderField { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .sliderField span { font-size:12px; opacity:0.9; }
    .sliderField .sliderRow { display:flex; align-items:center; gap:8px; }
    .sliderField .sliderRow input[type="range"] { flex:1; }
    .sliderField .sliderRow input[type="number"] { width:110px; box-sizing:border-box; }
    .smallBtn { padding:10px; }
    .toolGroup { display:flex; align-items:center; gap:6px; }
    .toolBtn { display:inline-flex; align-items:center; gap:8px; padding:8px 10px; }
    .toolBtn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .toolBtn.isActive { background:#1d3a78; border-color:rgba(255,255,255,0.28); }
    .reviewGrid { display:grid; grid-template-columns: minmax(0, 1fr); gap:10px; margin-top:8px; }
    .reviewField { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .reviewField span, .checkRow { font-size:12px; opacity:0.9; }
    .reviewField select { width:100%; box-sizing:border-box; }
    .checkRow { display:flex; align-items:center; gap:8px; }

    details summary { cursor:pointer; user-select:none; font-weight:600; }

  </style>
</head>

<body>
  <div id="left">
    <div class="label">View</div>
    <div class="row" style="margin-top:6px;">
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; opacity:0.95;">
        <input id="viewT1" type="radio" name="viewMode" value="T1" checked disabled>
        T1
      </label>
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; opacity:0.95;">
        <input id="viewT2" type="radio" name="viewMode" value="T2" disabled>
        T2
      </label>
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; opacity:0.95;">
        <input id="viewFlair" type="radio" name="viewMode" value="FLAIR" disabled>
        FLAIR
      </label>
    </div>

    <div class="label">Participant</div>
    <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
      <div class="chip">ID: <span id="sid" class="mono">------</span></div>
      <div class="chip">Index: <span id="sidx" class="mono">-</span>/<span id="scount" class="mono">-</span></div>
    </div>

    <div class="row" style="margin-top:12px;">
      <button id="prevBtn">← Prev</button>
      <button id="nextBtn">Next →</button>
    </div>
    <label class="checkRow" title="When enabled, Prev/Next skip participants that already have saved data in notes.csv.">
      <input id="skipReadSubjects" type="checkbox">
      Skip saved reads
    </label>
    <div class="status">Saved reads: <span id="savedReadCount" class="mono">0</span>/<span id="savedReadTotal" class="mono">-</span></div>

    <div class="label" style="margin-top:6px;">Go to participant ID</div>
    <div class="row">
      <input id="gotoInput" class="mono" placeholder="Loading IDs..." type="text" />
      <button id="goBtn">Go</button>
    </div>

    <div class="label" style="margin-top:6px;">Go to index (1-<span id="gotoIndexMax">?</span>)</div>
    <div class="row">
      <input id="gotoIndexInput" class="mono" placeholder="Loading index..." type="text" inputmode="numeric" />
      <button id="goIndexBtn">Go</button>
    </div>

    <div class="hr"></div>

    <div>
      <div class="label">Intensity range</div>
      <div class="rangeGrid">
        <label class="rangeField">
          <span>Min</span>
          <input id="imageRangeMin" class="mono" type="number" step="any" inputmode="decimal" disabled>
        </label>
        <label class="rangeField">
          <span>Max</span>
          <input id="imageRangeMax" class="mono" type="number" step="any" inputmode="decimal" disabled>
        </label>
        <button id="imageRangeReset" class="smallBtn" type="button" disabled>Auto</button>
      </div>
      <div class="wlGrid">
        <label class="sliderField">
          <span>Window</span>
          <div class="sliderRow">
            <input id="imageWindowSlider" type="range" step="any" disabled>
            <input id="imageWindowInput" class="mono" type="number" step="any" inputmode="decimal" disabled>
          </div>
        </label>
        <label class="sliderField">
          <span>Level</span>
          <div class="sliderRow">
            <input id="imageLevelSlider" type="range" step="any" disabled>
            <input id="imageLevelInput" class="mono" type="number" step="any" inputmode="decimal" disabled>
          </div>
        </label>
      </div>
      <div class="status">Adjust the displayed intensity range for the current image.</div>
    </div>

    <div class="hr"></div>

    <div class="label">Review</div>
    <div class="reviewGrid">
      <label class="reviewField">
        <span>Case</span>
        <select id="caseStatus">
          <option value="">Unset</option>
          <option value="Positive">Positive</option>
          <option value="Negative">Negative</option>
          <option value="Borderline">Borderline</option>
        </select>
      </label>
      <label class="checkRow">
        <input id="flagForReview" type="checkbox">
        Flag for review
      </label>
      <label class="checkRow">
        <input id="needsProcessingQc" type="checkbox">
        Needs processing QC
      </label>
    </div>

    <div class="hr"></div>

    <div class="label">Notes (autosaved locally; click “Save Notes” to write notes.csv)</div>
    <textarea id="notes" placeholder="Type notes here..."></textarea>

    <div class="row">
      <button id="saveBtn">Save Notes → notes.csv</button>
      <button id="clearBtn" title="Clears notes for current ID only">Clear This</button>
    </div>

    <div class="hr"></div>

    <div class="status" id="status"></div>
  </div>

  <div id="viewerWrap">
    <div id="topBar">
      <div class="chip">View: <span class="mono" id="viewModeChip">T1</span></div>
      <div class="chip">Source: <span class="mono" id="sourcePathChip">-</span></div>
      <div class="toolGroup" aria-label="Slice tools">
        <button id="sliceToolNavigate" class="toolBtn isActive" type="button" title="Default slice navigation tool">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v18"></path>
            <path d="M3 12h18"></path>
            <path d="m8 7 4-4 4 4"></path>
            <path d="m8 17 4 4 4-4"></path>
            <path d="m7 8-4 4 4 4"></path>
            <path d="m17 8 4 4-4 4"></path>
          </svg>
          <span>Navigate</span>
        </button>
        <button id="sliceToolZoom" class="toolBtn" type="button" title="Drag a rectangle on one slice pane to zoom only that pane">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="m20 20-4.2-4.2"></path>
            <path d="M8.5 11h5"></path>
            <path d="M11 8.5v5"></path>
          </svg>
          <span>Zoom</span>
        </button>
        <button id="sliceToolReset" class="toolBtn" type="button" title="Click a slice pane to reset only that pane's zoom">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10" cy="10" r="5.5"></circle>
            <path d="m19 19-3.5-3.5"></path>
            <path d="m16.5 4.5 3 3"></path>
            <path d="m19.5 4.5-3 3"></path>
          </svg>
          <span>Reset Zoom</span>
        </button>
        <button id="crosshairToggle" class="toolBtn isActive" type="button" title="Show or hide orthogonal slice crosshairs" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v16"></path>
            <path d="M4 12h16"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Crosshair</span>
        </button>
      </div>
      <div style="margin-left:auto" class="status" id="topStatus"></div>
    </div>
    <div id="gl"></div>
  </div>

  <script src="./niivue.umd.js"></script>

  <script>
    const LS_KEY = "FASTREADS_VASC_NOTES_V1";
    const REVIEW_LS_KEY = "FASTREADS_VASC_REVIEW_V1";
    const CASE_STATUS_VALUES = new Set(["", "Positive", "Negative", "Borderline"]);
    const VIEW = { T1: "T1", T2: "T2", FLAIR: "FLAIR" };
    const VIEW_ORDER = [VIEW.T1, VIEW.T2, VIEW.FLAIR];
    const VIEW_PATH_FIELD = {
      [VIEW.T1]: "t1_path",
      [VIEW.T2]: "t2_path",
      [VIEW.FLAIR]: "flair_path",
    };
    const SLICE_TOOL = { NAVIGATE: "navigate", ZOOM: "zoom", RESET: "reset" };
    const ORIENTATION = { AXIAL: 0, CORONAL: 1, SAGITTAL: 2 };
    const ORTHOGONAL_ORIENTATIONS = [ORIENTATION.AXIAL, ORIENTATION.CORONAL, ORIENTATION.SAGITTAL];

    // ---------------- UI ----------------
    const sidEl = document.getElementById("sid");
    const sidxEl = document.getElementById("sidx");
    const scountEl = document.getElementById("scount");
    const statusEl = document.getElementById("status");
    const topStatusEl = document.getElementById("topStatus");
    const viewModeChip = document.getElementById("viewModeChip");
    const sourcePathChip = document.getElementById("sourcePathChip");
    const sliceToolNavigateBtn = document.getElementById("sliceToolNavigate");
    const sliceToolZoomBtn = document.getElementById("sliceToolZoom");
    const sliceToolResetBtn = document.getElementById("sliceToolReset");
    const crosshairToggleBtn = document.getElementById("crosshairToggle");

    const viewInputs = {
      [VIEW.T1]: document.getElementById("viewT1"),
      [VIEW.T2]: document.getElementById("viewT2"),
      [VIEW.FLAIR]: document.getElementById("viewFlair"),
    };
    const imageRangeMin = document.getElementById("imageRangeMin");
    const imageRangeMax = document.getElementById("imageRangeMax");
    const imageRangeReset = document.getElementById("imageRangeReset");
    const imageWindowSlider = document.getElementById("imageWindowSlider");
    const imageWindowInput = document.getElementById("imageWindowInput");
    const imageLevelSlider = document.getElementById("imageLevelSlider");
    const imageLevelInput = document.getElementById("imageLevelInput");

    const notesEl = document.getElementById("notes");
    const caseStatusEl = document.getElementById("caseStatus");
    const flagForReviewEl = document.getElementById("flagForReview");
    const needsProcessingQcEl = document.getElementById("needsProcessingQc");
    const gotoInput = document.getElementById("gotoInput");
    const gotoIndexInput = document.getElementById("gotoIndexInput");
    const gotoIndexMax = document.getElementById("gotoIndexMax");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const goBtn = document.getElementById("goBtn");
    const goIndexBtn = document.getElementById("goIndexBtn");
    const skipReadSubjectsEl = document.getElementById("skipReadSubjects");
    const savedReadCountEl = document.getElementById("savedReadCount");
    const savedReadTotalEl = document.getElementById("savedReadTotal");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");

    // ---------------- Notes ----------------
    function loadLocalNotes() {
      try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; }
    }
    function saveLocalNotes(obj) { localStorage.setItem(LS_KEY, JSON.stringify(obj)); }
    let notesMap = loadLocalNotes();

    function defaultReviewState() {
      return { case_status: "", flag_for_review: false, needs_processing_qc: false };
    }

    function normalizeReviewState(value) {
      const review = defaultReviewState();
      if (!value || typeof value !== "object") return review;
      const caseStatus = String(value.case_status ?? value.IN_Case_Status ?? "").trim();
      review.case_status = CASE_STATUS_VALUES.has(caseStatus) ? caseStatus : "";
      review.flag_for_review = parseReviewBool(value.flag_for_review ?? value.IN_Flag_For_Review);
      review.needs_processing_qc = parseReviewBool(value.needs_processing_qc ?? value.IN_Needs_Processing_QC);
      return review;
    }

    function parseReviewBool(value) {
      if (typeof value === "boolean") return value;
      if (typeof value === "number") return value !== 0;
      const text = String(value ?? "").trim().toLowerCase();
      return text === "true" || text === "1" || text === "yes" || text === "y";
    }

    function loadLocalReview() {
      try {
        const raw = JSON.parse(localStorage.getItem(REVIEW_LS_KEY) || "{}");
        if (!raw || typeof raw !== "object") return {};
        const normalized = {};
        for (const [sid, value] of Object.entries(raw)) normalized[sid] = normalizeReviewState(value);
        return normalized;
      } catch {
        return {};
      }
    }

    function saveLocalReview(obj) { localStorage.setItem(REVIEW_LS_KEY, JSON.stringify(obj)); }
    let reviewMap = loadLocalReview();
    let crosshairVisible = true;
    let savedReadIds = new Set();

    function reviewHasData(value) {
      const review = normalizeReviewState(value);
      return Boolean(review.case_status || review.flag_for_review || review.needs_processing_qc);
    }

    function subjectHasSavedData(id, notesSource=notesMap, reviewSource=reviewMap) {
      const note = String(notesSource[id] ?? "").trim();
      return Boolean(note || reviewHasData(reviewSource[id]));
    }

    function rebuildSavedReadIds(notesSource, reviewSource) {
      savedReadIds = new Set();
      const ids = new Set([
        ...Object.keys(notesSource || {}),
        ...Object.keys(reviewSource || {}),
      ]);
      for (const id of ids) {
        if (subjectHasSavedData(id, notesSource, reviewSource)) savedReadIds.add(id);
      }
      updateSavedReadSummary();
    }

    function updateSavedReadSummary() {
      savedReadCountEl.textContent = String(savedReadIds.size);
      savedReadTotalEl.textContent = subjects.length ? String(subjects.length) : "-";
    }

    // ---------------- Image intensity range state ----------------
    function createEmptyRangeByView() {
      return Object.fromEntries(VIEW_ORDER.map((view) => [view, null]));
    }

    const imageDefaultRanges = new WeakMap();
    let imageRangeState = {
      subjectId: null,
      overrideRangeByView: createEmptyRangeByView(),
      defaultRangeByView: createEmptyRangeByView(),
      sliderBoundsByView: createEmptyRangeByView(),
      appliedRange: null,
    };

    // ---------------- Slice zoom state ----------------
    function createEmptySliceZoomByView() {
      const perView = {};
      for (const view of Object.values(VIEW)) {
        perView[view] = {
          [ORIENTATION.AXIAL]: null,
          [ORIENTATION.CORONAL]: null,
          [ORIENTATION.SAGITTAL]: null,
        };
      }
      return perView;
    }

    let currentSliceTool = SLICE_TOOL.NAVIGATE;
    let sliceZoomState = {
      subjectId: null,
      byView: createEmptySliceZoomByView(),
    };
    let zoomDrag = null;

    function cloneRange(range) {
      return range ? { min: range.min, max: range.max } : null;
    }

    function parseFiniteNumber(value) {
      const text = `${value ?? ""}`.trim();
      if (!text) return null;
      const num = Number(text);
      return Number.isFinite(num) ? num : null;
    }

    function makeRange(min, max) {
      return Number.isFinite(min) && Number.isFinite(max) && min < max
        ? { min, max }
        : null;
    }

    function rangeToWindowLevel(range) {
      return range
        ? {
            window: range.max - range.min,
            level: (range.min + range.max) / 2,
          }
        : null;
    }

    function makeWindowLevel(windowValue, levelValue) {
      return Number.isFinite(windowValue) && windowValue > 0 && Number.isFinite(levelValue)
        ? { window: windowValue, level: levelValue }
        : null;
    }

    function windowLevelToRange(windowValue, levelValue) {
      const windowLevel = makeWindowLevel(windowValue, levelValue);
      return windowLevel
        ? makeRange(
            windowLevel.level - windowLevel.window / 2,
            windowLevel.level + windowLevel.window / 2
          )
        : null;
    }

    function formatRangeNumber(value) {
      if (!Number.isFinite(value)) return "";
      const abs = Math.abs(value);
      if ((abs >= 10000 || (abs > 0 && abs < 0.001))) return value.toPrecision(6);
      return String(Number(value.toFixed(4)));
    }

    function createWindowLevelSliderBounds(range) {
      const windowLevel = rangeToWindowLevel(range);
      if (!windowLevel) return null;

      const baseWindow = windowLevel.window;
      const minWindow = Math.max(baseWindow / 20, Math.abs(baseWindow) * 0.001, 1e-6);
      return {
        windowMin: minWindow,
        // These are deliberately fixed while a subject is loaded. Changing
        // them during a drag makes the same pointer movement non-reversible.
        windowMax: Math.max(baseWindow * 1.5, minWindow * 2),
        levelMin: windowLevel.level - baseWindow * 0.75,
        levelMax: windowLevel.level + baseWindow * 0.75,
      };
    }

    function ensureWindowLevelSliderBounds(view, range=null) {
      let bounds = imageRangeState.sliderBoundsByView[view];
      if (!bounds) {
        const seedRange = range || imageRangeState.defaultRangeByView[view] || displayedImageRangeForView(view);
        bounds = seedRange ? createWindowLevelSliderBounds(seedRange) : null;
        imageRangeState.sliderBoundsByView[view] = bounds;
      }

      return bounds;
    }

    function clampToBounds(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function syncImageRangeControls(range) {
      imageRangeMin.value = range ? formatRangeNumber(range.min) : "";
      imageRangeMax.value = range ? formatRangeNumber(range.max) : "";

      const windowLevel = rangeToWindowLevel(range);
      imageWindowInput.value = windowLevel ? formatRangeNumber(windowLevel.window) : "";
      imageLevelInput.value = windowLevel ? formatRangeNumber(windowLevel.level) : "";

      const bounds = ensureWindowLevelSliderBounds(currentView, range);
      if (bounds) {
        imageWindowSlider.min = formatRangeNumber(bounds.windowMin);
        imageWindowSlider.max = formatRangeNumber(bounds.windowMax);
        imageLevelSlider.min = formatRangeNumber(bounds.levelMin);
        imageLevelSlider.max = formatRangeNumber(bounds.levelMax);
        imageWindowSlider.value = windowLevel
          ? formatRangeNumber(clampToBounds(windowLevel.window, bounds.windowMin, bounds.windowMax))
          : imageWindowSlider.min;
        imageLevelSlider.value = windowLevel
          ? formatRangeNumber(clampToBounds(windowLevel.level, bounds.levelMin, bounds.levelMax))
          : imageLevelSlider.min;
      } else {
        imageWindowSlider.min = "0";
        imageWindowSlider.max = "1";
        imageWindowSlider.value = "0";
        imageLevelSlider.min = "0";
        imageLevelSlider.max = "1";
        imageLevelSlider.value = "0";
      }
    }

    function setImageRangeControlsEnabled(enabled) {
      imageRangeMin.disabled = !enabled;
      imageRangeMax.disabled = !enabled;
      imageRangeReset.disabled = !enabled;
      imageWindowSlider.disabled = !enabled;
      imageWindowInput.disabled = !enabled;
      imageLevelSlider.disabled = !enabled;
      imageLevelInput.disabled = !enabled;
    }

    function resetImageRangeState(subjectId) {
      imageRangeState = {
        subjectId,
        overrideRangeByView: createEmptyRangeByView(),
        defaultRangeByView: createEmptyRangeByView(),
        sliderBoundsByView: createEmptyRangeByView(),
        appliedRange: null,
      };
      syncImageRangeControls(null);
      setImageRangeControlsEnabled(false);
    }

    // ---------------- Niivue ----------------
    const { Niivue, NVImage } = (window.niivue || {});
    if (!Niivue || !NVImage) {
      alert("Niivue UMD did not expose Niivue/NVImage. Check niivue.umd.js.");
      throw new Error("Missing Niivue/NVImage");
    }

    const glDiv = document.getElementById("gl");
    const canvas = document.createElement("canvas");
    canvas.className = "viewerCanvas";
    glDiv.appendChild(canvas);
    const toolOverlay = document.createElement("canvas");
    toolOverlay.className = "toolOverlay";
    glDiv.appendChild(toolOverlay);
    const toolOverlayCtx = toolOverlay.getContext("2d");

    let nv = null;
    function isVectorLike(value) {
      return Array.isArray(value) || ArrayBuffer.isView(value);
    }

    function clonePanState(pan) {
      return isVectorLike(pan) ? Array.from(pan).slice(0, 4) : null;
    }

    function defaultPanState() {
      return [0, 0, 0, 1];
    }

    function normalizePanState(pan) {
      if (!isVectorLike(pan)) return defaultPanState();
      const out = defaultPanState();
      for (let i = 0; i < 4; i++) {
        const value = Number(pan[i]);
        if (Number.isFinite(value)) out[i] = value;
      }
      if (!(out[3] > 0)) out[3] = 1;
      return out;
    }

    function isDefaultPanState(pan) {
      const normalized = normalizePanState(pan);
      return normalized[0] === 0 && normalized[1] === 0 && normalized[2] === 0 && normalized[3] === 1;
    }

    function isOrthogonalOrientation(value) {
      return ORTHOGONAL_ORIENTATIONS.includes(value);
    }

    function resetSliceZoomState(subjectId) {
      sliceZoomState = {
        subjectId,
        byView: createEmptySliceZoomByView(),
      };
      zoomDrag = null;
      redrawToolOverlay();
    }

    function getStoredSlicePan(view, orientation) {
      return normalizePanState(sliceZoomState.byView[view]?.[orientation]);
    }

    function setStoredSlicePan(view, orientation, pan) {
      const normalized = normalizePanState(pan);
      sliceZoomState.byView[view][orientation] = isDefaultPanState(normalized) ? null : clonePanState(normalized);
    }

    function clearStoredSlicePan(view, orientation) {
      if (!sliceZoomState.byView[view]) return;
      sliceZoomState.byView[view][orientation] = null;
    }

    function panStateToPlane(pan, orientation) {
      const [x, y, z] = normalizePanState(pan);
      if (orientation === ORIENTATION.AXIAL) return [x, y];
      if (orientation === ORIENTATION.CORONAL) return [x, z];
      return [y, z];
    }

    function planeToPanState(orientation, plane, zoom) {
      const [u, v] = plane;
      const nextZoom = Number.isFinite(zoom) && zoom > 0 ? zoom : 1;
      if (orientation === ORIENTATION.AXIAL) return [u, v, 0, nextZoom];
      if (orientation === ORIENTATION.CORONAL) return [u, 0, v, nextZoom];
      return [0, u, v, nextZoom];
    }

    function mmToPlane(mm, orientation) {
      if (!isVectorLike(mm) || mm.length < 3) return [NaN, NaN];
      if (orientation === ORIENTATION.AXIAL) return [mm[0], mm[1]];
      if (orientation === ORIENTATION.CORONAL) return [mm[0], mm[2]];
      return [mm[1], mm[2]];
    }

    function normalizePaneBounds(leftTopWidthHeight) {
      let [x, y, w, h] = leftTopWidthHeight;
      if (w < 0) {
        x += w;
        w = -w;
      }
      if (h < 0) {
        y += h;
        h = -h;
      }
      return { x, y, w, h };
    }

    function syncToolOverlayCanvasSize() {
      const width = canvas.width || Math.max(1, glDiv.clientWidth);
      const height = canvas.height || Math.max(1, glDiv.clientHeight);
      if (toolOverlay.width !== width) toolOverlay.width = width;
      if (toolOverlay.height !== height) toolOverlay.height = height;
    }

    function clearToolOverlay() {
      syncToolOverlayCanvasSize();
      toolOverlayCtx.clearRect(0, 0, toolOverlay.width, toolOverlay.height);
    }

    function redrawToolOverlay() {
      clearToolOverlay();
      if (currentSliceTool !== SLICE_TOOL.ZOOM || !zoomDrag) return;

      const bounds = zoomDrag.pane.bounds;
      const x0 = Math.min(zoomDrag.start[0], zoomDrag.end[0]);
      const y0 = Math.min(zoomDrag.start[1], zoomDrag.end[1]);
      const x1 = Math.max(zoomDrag.start[0], zoomDrag.end[0]);
      const y1 = Math.max(zoomDrag.start[1], zoomDrag.end[1]);

      toolOverlayCtx.save();
      toolOverlayCtx.strokeStyle = "rgba(141, 197, 255, 0.95)";
      toolOverlayCtx.fillStyle = "rgba(141, 197, 255, 0.14)";
      toolOverlayCtx.lineWidth = Math.max(1.5, toolOverlay.width / 700);
      toolOverlayCtx.setLineDash([10, 6]);
      toolOverlayCtx.beginPath();
      toolOverlayCtx.rect(bounds.x, bounds.y, bounds.w, bounds.h);
      toolOverlayCtx.clip();
      toolOverlayCtx.fillRect(x0, y0, x1 - x0, y1 - y0);
      toolOverlayCtx.strokeRect(x0, y0, x1 - x0, y1 - y0);
      toolOverlayCtx.restore();
    }

    function scheduleToolOverlayRedraw() {
      requestAnimationFrame(() => redrawToolOverlay());
    }

    function redrawViewer() {
      try { nv.drawScene && nv.drawScene(); }
      catch {
        try { nv.updateGLVolume && nv.updateGLVolume(); } catch {}
      }
      redrawToolOverlay();
    }

    function wrapPerPaneDraw2D(viewer) {
      if (!viewer || viewer.__perPaneZoomWrapped) return viewer;
      const originalDraw2D = viewer.draw2D.bind(viewer);
      const originalDrawCrossLines = viewer.drawCrossLines?.bind(viewer);
      const originalDrawCrossLinesMM = viewer.drawCrossLinesMM?.bind(viewer);
      const originalDrawCrosshairs3D = viewer.drawCrosshairs3D?.bind(viewer);
      viewer.draw2D = function(bounds, sliceType, ...rest) {
        if (!isOrthogonalOrientation(sliceType)) return originalDraw2D(bounds, sliceType, ...rest);
        const previousPan = normalizePanState(this.scene.pan2Dxyzmm);
        this.scene.pan2Dxyzmm = getStoredSlicePan(currentView, sliceType);
        try {
          return originalDraw2D(bounds, sliceType, ...rest);
        } finally {
          this.scene.pan2Dxyzmm = previousPan;
        }
      };
      if (originalDrawCrossLines) {
        viewer.drawCrossLines = function(...args) {
          if (!crosshairVisible) return;
          return originalDrawCrossLines(...args);
        };
      }
      if (originalDrawCrossLinesMM) {
        viewer.drawCrossLinesMM = function(...args) {
          if (!crosshairVisible) return;
          return originalDrawCrossLinesMM(...args);
        };
      }
      if (originalDrawCrosshairs3D) {
        viewer.drawCrosshairs3D = function(...args) {
          if (!crosshairVisible) return;
          return originalDrawCrosshairs3D(...args);
        };
      }
      viewer.__perPaneZoomWrapped = true;
      return viewer;
    }

    function createNiivueInstance() {
      const n = new Niivue({ isColorbar:false, backColor:[0,0,0,1], show3Dcrosshair:crosshairVisible });
      n.attachToCanvas(canvas);
      return wrapPerPaneDraw2D(n);
    }
    nv = createNiivueInstance();

    function setCrosshairVisible(nextVisible) {
      crosshairVisible = Boolean(nextVisible);
      if (nv?.opts) nv.opts.show3Dcrosshair = crosshairVisible;
      crosshairToggleBtn.classList.toggle("isActive", crosshairVisible);
      crosshairToggleBtn.setAttribute("aria-pressed", String(crosshairVisible));
      redrawViewer();
    }

    // ---------------- Safe setters (INDEX-based) ----------------
    function volCount() { return Array.isArray(nv.volumes) ? nv.volumes.length : 0; }

    function setOpacitySafe(i, op) {
      if (i < 0 || i >= volCount()) return;
      try { nv.setOpacity(i, op); }
      catch {
        try { nv.volumes[i].opacity = op; } catch {}
      }
    }

    function setColormapSafe(i, cmap) {
      if (i < 0 || i >= volCount()) return;
      try { nv.setColormap(i, cmap); }
      catch {
        try { nv.volumes[i].colormap = cmap; } catch {}
      }
    }

    function setColormapInvertSafe(i, invert) {
      if (i < 0 || i >= volCount()) return;
      try { nv.volumes[i].colormapInvert = !!invert; } catch {}
    }

    function setCalibrationSafe(i, mn, mx) {
      if (i < 0 || i >= volCount()) return;
      try { nv.setCalibration(i, mn, mx); }
      catch {
        try { nv.volumes[i].cal_min = mn; nv.volumes[i].cal_max = mx; } catch {}
      }
    }

    function refresh() {
      try { nv.updateGLVolume && nv.updateGLVolume(); } catch {}
      scheduleToolOverlayRedraw();
    }

    function activeImageVolumeIndex() {
      return volCount() >= 1 ? 0 : -1;
    }

    function readImageRange(img, minKey, maxKey) {
      const mn = parseFiniteNumber(img?.[minKey]);
      const mx = parseFiniteNumber(img?.[maxKey]);
      return makeRange(mn, mx);
    }

    function rememberImageDefaultRange(img) {
      if (!img) return null;
      const cached = imageDefaultRanges.get(img);
      if (cached) return cloneRange(cached);

      const range = readImageRange(img, "cal_min", "cal_max")
        || readImageRange(img, "robust_min", "robust_max")
        || readImageRange(img, "global_min", "global_max");

      if (range) imageDefaultRanges.set(img, cloneRange(range));
      return cloneRange(range);
    }

    function displayedImageRangeForView(view=currentView) {
      return cloneRange(
        imageRangeState.overrideRangeByView[view]
        || imageRangeState.defaultRangeByView[view]
      );
    }

    function refreshImageRangeUi() {
      syncImageRangeControls(displayedImageRangeForView(currentView));
      setImageRangeControlsEnabled(activeImageVolumeIndex() >= 0 && !!displayedImageRangeForView(currentView));
    }

    function applyImageRangeToActiveVolume() {
      const volumeIndex = activeImageVolumeIndex();
      const range = displayedImageRangeForView(currentView);
      if (volumeIndex < 0 || !range) {
        imageRangeState.appliedRange = null;
        refreshImageRangeUi();
        return false;
      }

      setCalibrationSafe(volumeIndex, range.min, range.max);
      imageRangeState.appliedRange = cloneRange(range);
      refreshImageRangeUi();
      return true;
    }

    function updateImageRangeForLoadedImage(view, img) {
      const defaultRange = rememberImageDefaultRange(img);
      imageRangeState.defaultRangeByView[view] = defaultRange;
      imageRangeState.sliderBoundsByView[view] = defaultRange ? createWindowLevelSliderBounds(defaultRange) : null;
      applyImageRangeToActiveVolume();
    }

    function readImageRangeInputs() {
      return makeRange(
        parseFiniteNumber(imageRangeMin.value),
        parseFiniteNumber(imageRangeMax.value)
      );
    }

    function applyManualImageRangeFromInputs() {
      const range = readImageRangeInputs();
      if (!range) return false;
      imageRangeState.overrideRangeByView[currentView] = cloneRange(range);
      const applied = applyImageRangeToActiveVolume();
      if (applied) refresh();
      return applied;
    }

    function readImageWindowLevelInputs() {
      return makeWindowLevel(
        parseFiniteNumber(imageWindowInput.value),
        parseFiniteNumber(imageLevelInput.value)
      );
    }

    function applyManualImageWindowLevel(windowValue, levelValue) {
      const range = windowLevelToRange(windowValue, levelValue);
      if (!range) return false;
      imageRangeState.overrideRangeByView[currentView] = cloneRange(range);
      const applied = applyImageRangeToActiveVolume();
      if (applied) refresh();
      return applied;
    }

    function applyManualImageWindowLevelFromInputs() {
      const windowLevel = readImageWindowLevelInputs();
      if (!windowLevel) return false;
      return applyManualImageWindowLevel(windowLevel.window, windowLevel.level);
    }

    function syncImageRangeControlsToApplied() {
      syncImageRangeControls(displayedImageRangeForView(currentView));
    }

    function removeAllVolumesCompat() {
      if (typeof nv.removeAllVolumes === "function") { nv.removeAllVolumes(); return; }
      if (typeof nv.removeVolume === "function" && Array.isArray(nv.volumes)) {
        for (let i = nv.volumes.length - 1; i >= 0; i--) { try { nv.removeVolume(i); } catch {} }
        return;
      }
      nv = createNiivueInstance();
      scheduleToolOverlayRedraw();
    }

    // ---------------- Data ----------------
    let subjects = []; // from /api/subjects
    let idx = 0;
    let currentId = null;
    let currentView = VIEW.T1;
    let defaultSearchId = "";
    let loadRequestId = 0;

    function configureIdSearchUi() {
      defaultSearchId = subjects[0]?.id || "";
      gotoInput.placeholder = defaultSearchId ? `e.g., ${defaultSearchId}` : "Enter participant ID";
      gotoIndexMax.textContent = subjects.length ? String(subjects.length) : "?";
      gotoIndexInput.placeholder = subjects.length ? `1-${subjects.length}` : "Enter index";
      updateSavedReadSummary();
    }

    function pathForView(subject, view) {
      return subject?.[VIEW_PATH_FIELD[view]] || null;
    }

    function availableView(subject, preferredView=currentView) {
      if (pathForView(subject, preferredView)) return preferredView;
      return VIEW_ORDER.find((view) => pathForView(subject, view)) || null;
    }

    function rebuildBaseVolume(image) {
      removeAllVolumesCompat();
      nv.addVolume(image); // base structural image is always index 0
    }

    function applyStructuralDisplaySettings() {
      if (volCount() < 1) return;
      setColormapSafe(0, "gray");
      setColormapInvertSafe(0, false);
      setOpacitySafe(0, 1.0);
      applyImageRangeToActiveVolume();
      refresh();
    }

    function setSliceTool(nextTool) {
      if (!Object.values(SLICE_TOOL).includes(nextTool)) return;
      currentSliceTool = nextTool;
      if (zoomDrag) zoomDrag = null;

      const isNavigate = nextTool === SLICE_TOOL.NAVIGATE;
      const isZoom = nextTool === SLICE_TOOL.ZOOM;
      const isReset = nextTool === SLICE_TOOL.RESET;

      sliceToolNavigateBtn.classList.toggle("isActive", isNavigate);
      sliceToolZoomBtn.classList.toggle("isActive", isZoom);
      sliceToolResetBtn.classList.toggle("isActive", isReset);
      sliceToolNavigateBtn.setAttribute("aria-pressed", String(isNavigate));
      sliceToolZoomBtn.setAttribute("aria-pressed", String(isZoom));
      sliceToolResetBtn.setAttribute("aria-pressed", String(isReset));

      toolOverlay.style.pointerEvents = isNavigate ? "none" : "auto";
      toolOverlay.style.cursor = isZoom ? "crosshair" : (isReset ? "cell" : "default");
      redrawToolOverlay();
    }

    function getOrthogonalPanes() {
      const panes = [];
      const slices = Array.isArray(nv.screenSlices) ? nv.screenSlices : [];
      for (let index = 0; index < slices.length; index++) {
        const slice = slices[index];
        if (!isOrthogonalOrientation(slice?.axCorSag)) continue;
        panes.push({
          index,
          orientation: slice.axCorSag,
          bounds: normalizePaneBounds(slice.leftTopWidthHeight || [0, 0, 0, 0]),
        });
      }
      return panes;
    }

    function findPaneAtCanvasPoint(x, y) {
      return getOrthogonalPanes().find((pane) => (
        x >= pane.bounds.x
        && y >= pane.bounds.y
        && x <= pane.bounds.x + pane.bounds.w
        && y <= pane.bounds.y + pane.bounds.h
      )) || null;
    }

    function eventToCanvasPoint(ev) {
      syncToolOverlayCanvasSize();
      const rect = toolOverlay.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      const scaleX = toolOverlay.width / rect.width;
      const scaleY = toolOverlay.height / rect.height;
      return [
        (ev.clientX - rect.left) * scaleX,
        (ev.clientY - rect.top) * scaleY,
      ];
    }

    function clampPointToPane(point, pane) {
      return [
        Math.min(Math.max(point[0], pane.bounds.x), pane.bounds.x + pane.bounds.w),
        Math.min(Math.max(point[1], pane.bounds.y), pane.bounds.y + pane.bounds.h),
      ];
    }

    function canvasPointToMm(point, pane) {
      const mm = nv.screenXY2mm ? nv.screenXY2mm(point[0], point[1], pane.index) : [NaN, NaN, NaN];
      return isVectorLike(mm) ? Array.from(mm) : [NaN, NaN, NaN];
    }

    function finishZoomDrag() {
      if (!zoomDrag) return;

      const drag = zoomDrag;
      zoomDrag = null;

      const x0 = Math.min(drag.start[0], drag.end[0]);
      const y0 = Math.min(drag.start[1], drag.end[1]);
      const x1 = Math.max(drag.start[0], drag.end[0]);
      const y1 = Math.max(drag.start[1], drag.end[1]);
      const rectWidth = x1 - x0;
      const rectHeight = y1 - y0;

      if (rectWidth < 8 || rectHeight < 8) {
        redrawToolOverlay();
        return;
      }

      const paneWidth = drag.pane.bounds.w;
      const paneHeight = drag.pane.bounds.h;
      if (!(paneWidth > 0) || !(paneHeight > 0)) {
        redrawToolOverlay();
        return;
      }

      const factor = Math.min(paneWidth / rectWidth, paneHeight / rectHeight);
      const currentPan = getStoredSlicePan(currentView, drag.pane.orientation);
      const currentZoom = currentPan[3];
      const newZoom = Math.min(10, Math.max(0.1, currentZoom * factor));
      if (!(newZoom > 0)) {
        redrawToolOverlay();
        return;
      }

      const paneCenterPoint = [
        drag.pane.bounds.x + drag.pane.bounds.w * 0.5,
        drag.pane.bounds.y + drag.pane.bounds.h * 0.5,
      ];
      const selectionCenterPoint = [
        x0 + rectWidth * 0.5,
        y0 + rectHeight * 0.5,
      ];

      const paneCenterMm = canvasPointToMm(paneCenterPoint, drag.pane);
      const selectionCenterMm = canvasPointToMm(selectionCenterPoint, drag.pane);
      if (!paneCenterMm.slice(0, 3).every(Number.isFinite) || !selectionCenterMm.slice(0, 3).every(Number.isFinite)) {
        redrawToolOverlay();
        return;
      }

      const centeredPan = [
        currentPan[0] + currentZoom * (paneCenterMm[0] - selectionCenterMm[0]),
        currentPan[1] + currentZoom * (paneCenterMm[1] - selectionCenterMm[1]),
        currentPan[2] + currentZoom * (paneCenterMm[2] - selectionCenterMm[2]),
      ];
      const zoomDelta = currentZoom - newZoom;
      const nextPan = [
        centeredPan[0] + zoomDelta * selectionCenterMm[0],
        centeredPan[1] + zoomDelta * selectionCenterMm[1],
        centeredPan[2] + zoomDelta * selectionCenterMm[2],
        newZoom,
      ];

      setStoredSlicePan(currentView, drag.pane.orientation, nextPan);
      redrawViewer();
    }

    // ---------------- UI events ----------------
    imageRangeMin.addEventListener("input", () => {
      applyManualImageRangeFromInputs();
    });

    imageRangeMax.addEventListener("input", () => {
      applyManualImageRangeFromInputs();
    });

    imageRangeMin.addEventListener("blur", () => {
      if (!readImageRangeInputs()) syncImageRangeControlsToApplied();
    });

    imageRangeMax.addEventListener("blur", () => {
      if (!readImageRangeInputs()) syncImageRangeControlsToApplied();
    });

    imageWindowInput.addEventListener("input", () => {
      applyManualImageWindowLevelFromInputs();
    });

    imageLevelInput.addEventListener("input", () => {
      applyManualImageWindowLevelFromInputs();
    });

    imageWindowInput.addEventListener("blur", () => {
      if (!readImageWindowLevelInputs()) syncImageRangeControlsToApplied();
    });

    imageLevelInput.addEventListener("blur", () => {
      if (!readImageWindowLevelInputs()) syncImageRangeControlsToApplied();
    });

    imageWindowSlider.addEventListener("input", () => {
      const current = rangeToWindowLevel(displayedImageRangeForView(currentView));
      applyManualImageWindowLevel(
        parseFiniteNumber(imageWindowSlider.value),
        current?.level
      );
    });

    imageLevelSlider.addEventListener("input", () => {
      const current = rangeToWindowLevel(displayedImageRangeForView(currentView));
      applyManualImageWindowLevel(
        current?.window,
        parseFiniteNumber(imageLevelSlider.value)
      );
    });

    imageRangeReset.addEventListener("click", () => {
      imageRangeState.overrideRangeByView[currentView] = null;
      if (applyImageRangeToActiveVolume()) refresh();
    });

    sliceToolNavigateBtn.addEventListener("click", () => setSliceTool(SLICE_TOOL.NAVIGATE));
    sliceToolZoomBtn.addEventListener("click", () => setSliceTool(SLICE_TOOL.ZOOM));
    sliceToolResetBtn.addEventListener("click", () => setSliceTool(SLICE_TOOL.RESET));
    crosshairToggleBtn.addEventListener("click", () => setCrosshairVisible(!crosshairVisible));

    toolOverlay.addEventListener("pointerdown", (ev) => {
      if (currentSliceTool === SLICE_TOOL.NAVIGATE) return;
      const point = eventToCanvasPoint(ev);
      if (!point) return;
      const pane = findPaneAtCanvasPoint(point[0], point[1]);
      if (!pane) return;

      ev.preventDefault();

      if (currentSliceTool === SLICE_TOOL.RESET) {
        clearStoredSlicePan(currentView, pane.orientation);
        redrawViewer();
        return;
      }

      zoomDrag = {
        pointerId: ev.pointerId,
        pane,
        start: clampPointToPane(point, pane),
        end: clampPointToPane(point, pane),
      };
      toolOverlay.setPointerCapture?.(ev.pointerId);
      redrawToolOverlay();
    });

    toolOverlay.addEventListener("pointermove", (ev) => {
      if (!zoomDrag || currentSliceTool !== SLICE_TOOL.ZOOM) return;
      if (zoomDrag.pointerId !== ev.pointerId) return;
      const point = eventToCanvasPoint(ev);
      if (!point) return;
      zoomDrag.end = clampPointToPane(point, zoomDrag.pane);
      redrawToolOverlay();
    });

    toolOverlay.addEventListener("pointerup", (ev) => {
      if (!zoomDrag || zoomDrag.pointerId !== ev.pointerId) return;
      toolOverlay.releasePointerCapture?.(ev.pointerId);
      const point = eventToCanvasPoint(ev);
      if (point) zoomDrag.end = clampPointToPane(point, zoomDrag.pane);
      finishZoomDrag();
    });

    toolOverlay.addEventListener("pointercancel", (ev) => {
      if (!zoomDrag || zoomDrag.pointerId !== ev.pointerId) return;
      toolOverlay.releasePointerCapture?.(ev.pointerId);
      zoomDrag = null;
      redrawToolOverlay();
    });

    window.addEventListener("resize", () => {
      scheduleToolOverlayRedraw();
    });

    function setViewUiState(subject=subjects[idx]) {
      viewModeChip.textContent = currentView;
      for (const view of VIEW_ORDER) {
        viewInputs[view].disabled = !pathForView(subject, view);
        viewInputs[view].checked = currentView === view;
      }
    }

    async function setViewMode(nextView) {
      if (!VIEW_ORDER.includes(nextView)) return;
      if (!pathForView(subjects[idx], nextView)) return;
      if (nextView === currentView) return;
      currentView = nextView;
      setViewUiState();
      await loadSubjectByIndex(idx);
    }

    for (const view of VIEW_ORDER) {
      viewInputs[view].addEventListener("change", () => {
        if (viewInputs[view].checked) setViewMode(view);
      });
    }

    function syncReviewControlsForCurrentSubject() {
      const review = normalizeReviewState(reviewMap[currentId]);
      caseStatusEl.value = review.case_status;
      flagForReviewEl.checked = review.flag_for_review;
      needsProcessingQcEl.checked = review.needs_processing_qc;
    }

    function saveCurrentReviewFromControls() {
      if (!currentId) return;
      reviewMap[currentId] = {
        case_status: CASE_STATUS_VALUES.has(caseStatusEl.value) ? caseStatusEl.value : "",
        flag_for_review: flagForReviewEl.checked,
        needs_processing_qc: needsProcessingQcEl.checked,
      };
      saveLocalReview(reviewMap);
      statusEl.textContent = "Review fields autosaved locally (not yet written to notes.csv).";
    }

    // ---------------- Navigation ----------------
    function findIndexById(id){ return subjects.findIndex(s => s.id === id); }

    function readIndexInputValue() {
      const text = (gotoIndexInput.value || "").trim();
      if (!/^\d+$/.test(text)) return null;
      const value = Number(text);
      return Number.isInteger(value) ? value : null;
    }

    function findNextReadableIndex(startIndex, step) {
      if (!skipReadSubjectsEl.checked) return Math.max(0, Math.min(startIndex + step, subjects.length - 1));

      for (let nextIndex = startIndex + step; nextIndex >= 0 && nextIndex < subjects.length; nextIndex += step) {
        if (!savedReadIds.has(subjects[nextIndex].id)) return nextIndex;
      }
      return -1;
    }

    function goRelativeSubject(step) {
      if (!subjects.length) return;
      const nextIndex = findNextReadableIndex(idx, step);
      if (nextIndex < 0 || nextIndex === idx) {
        const direction = step > 0 ? "after" : "before";
        statusEl.textContent = skipReadSubjectsEl.checked
          ? `No unread subjects ${direction} index ${idx + 1}.`
          : `Already at the ${step > 0 ? "last" : "first"} subject.`;
        return;
      }
      loadSubjectByIndex(nextIndex);
    }

    async function loadSubjectByIndex(newIdx){
      if (!subjects.length) return;
      idx = Math.max(0, Math.min(newIdx, subjects.length - 1));
      const subj = subjects[idx];
      const nextView = availableView(subj, currentView);
      if (!nextView) return;
      currentView = nextView;
      const requestId = ++loadRequestId;

      if (imageRangeState.subjectId !== subj.id) resetImageRangeState(subj.id);
      if (sliceZoomState.subjectId !== subj.id) resetSliceZoomState(subj.id);
      currentId = subj.id;
      sidEl.textContent = currentId;
      sidxEl.textContent = String(idx + 1);
      scountEl.textContent = String(subjects.length);

      notesEl.value = (notesMap[currentId] ?? "");
      syncReviewControlsForCurrentSubject();
      setViewUiState(subj);

      const imagePath = pathForView(subj, currentView);
      sourcePathChip.textContent = decodeURIComponent(imagePath.split("/").pop());
      topStatusEl.textContent = imagePath;
      statusEl.textContent = `Loading ${currentView} volume...`;

      removeAllVolumesCompat();
      imageRangeState.appliedRange = null;
      refreshImageRangeUi();
      redrawViewer();

      try {
        const image = await NVImage.loadFromUrl({ url: imagePath });
        if (requestId !== loadRequestId) return;
        rememberImageDefaultRange(image);
        rebuildBaseVolume(image);

        // Important: wait one tick so nv.volumes is populated in this Niivue build
        await new Promise(r => requestAnimationFrame(r));
        if (requestId !== loadRequestId) return;

        updateImageRangeForLoadedImage(currentView, image);
        applyStructuralDisplaySettings();
        redrawViewer();
        statusEl.textContent = `Ready (${currentView}).`;
      } catch (e) {
        if (requestId !== loadRequestId) return;
        console.error(e);
        removeAllVolumesCompat();
        imageRangeState.appliedRange = null;
        refreshImageRangeUi();
        redrawViewer();
        statusEl.textContent = `ERROR loading ${currentView} volume (see console).`;
      }
    }

    // Notes
    notesEl.addEventListener("input", () => {
      if (!currentId) return;
      notesMap[currentId] = notesEl.value;
      saveLocalNotes(notesMap);
      statusEl.textContent = "Notes autosaved locally (not yet written to notes.csv).";
    });

    caseStatusEl.addEventListener("change", saveCurrentReviewFromControls);
    flagForReviewEl.addEventListener("change", saveCurrentReviewFromControls);
    needsProcessingQcEl.addEventListener("change", saveCurrentReviewFromControls);

    clearBtn.addEventListener("click", () => {
      if (!currentId) return;
      notesEl.value = "";
      caseStatusEl.value = "";
      flagForReviewEl.checked = false;
      needsProcessingQcEl.checked = false;
      notesMap[currentId] = "";
      reviewMap[currentId] = defaultReviewState();
      saveLocalNotes(notesMap);
      saveLocalReview(reviewMap);
      statusEl.textContent = `Cleared notes and review fields for ${currentId}.`;
    });

    prevBtn.addEventListener("click", () => goRelativeSubject(-1));
    nextBtn.addEventListener("click", () => goRelativeSubject(1));

    skipReadSubjectsEl.addEventListener("change", () => {
      statusEl.textContent = skipReadSubjectsEl.checked
        ? `Skipping saved reads (${savedReadIds.size} saved).`
        : "Showing all subjects in sequence.";
    });

    goBtn.addEventListener("click", () => {
      const id = (gotoInput.value || "").trim();
      if (!id) {
        statusEl.textContent = `Enter a participant ID${defaultSearchId ? ` like ${defaultSearchId}` : ""}.`;
        return;
      }
      const j = findIndexById(id);
      if (j < 0) {
        const hint = defaultSearchId ? ` Example: ${defaultSearchId}.` : "";
        statusEl.textContent = `ID ${id} not found.${hint}`;
        return;
      }
      loadSubjectByIndex(j);
    });

    goIndexBtn.addEventListener("click", () => {
      const requestedIndex = readIndexInputValue();
      if (requestedIndex === null) {
        statusEl.textContent = `Enter an index from 1 to ${subjects.length || "?"}.`;
        return;
      }
      if (requestedIndex < 1 || requestedIndex > subjects.length) {
        statusEl.textContent = `Index ${requestedIndex} is outside 1-${subjects.length}.`;
        return;
      }
      loadSubjectByIndex(requestedIndex - 1);
    });

    gotoInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") goBtn.click();
    });

    gotoIndexInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") goIndexBtn.click();
    });

    saveBtn.addEventListener("click", async () => {
      try {
        statusEl.textContent = "Saving notes.csv...";
        const r = await fetch("/api/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ notes: notesMap, review: reviewMap })
        });
        const out = await r.json();
        if (!out.ok) throw new Error(out.error || "Save failed");
        rebuildSavedReadIds(notesMap, reviewMap);
        statusEl.textContent = `Saved notes.csv (rows with saved data: ${out.count}).`;
      } catch (e) {
        console.error(e);
        statusEl.textContent = "ERROR saving notes.csv (see console).";
      }
    });

    // ---------------- Init ----------------
    async function init(){
      try {
        statusEl.textContent = "Loading participant list...";
        const rs = await fetch("/api/subjects");
        if (!rs.ok) throw new Error(`Participant request failed (${rs.status}).`);
        const js = await rs.json();

        // Server returns explicit paths for the three first-wave modalities.
        subjects = (js.subjects || []).map(s => ({
          id: String(s.id),
          t1_path: s.t1_path || null,
          t2_path: s.t2_path || null,
          flair_path: s.flair_path || null,
        })).filter(s => s.t1_path || s.t2_path || s.flair_path);
        if (!subjects.length) {
          setViewUiState(null);
          statusEl.textContent = "No usable participants found in data/. Add at least one expected T1, T2, or FLAIR NIfTI file.";
          return;
        }
        configureIdSearchUi();
        scountEl.textContent = String(subjects.length);

        // merge notes.csv from server into local (local wins)
        try {
          const rn = await fetch("/api/notes");
          const jn = await rn.json();
          let serverNotes = {};
          let serverReview = {};
          if (jn && jn.notes && typeof jn.notes === "object") {
            serverNotes = jn.notes;
            notesMap = { ...serverNotes, ...notesMap };
            saveLocalNotes(notesMap);
          }
          if (jn && jn.review && typeof jn.review === "object") {
            for (const [sid, value] of Object.entries(jn.review)) {
              serverReview[sid] = normalizeReviewState(value);
            }
            reviewMap = { ...serverReview, ...reviewMap };
            saveLocalReview(reviewMap);
          }
          rebuildSavedReadIds(serverNotes, serverReview);
        } catch {}

        currentView = availableView(subjects[0], VIEW.T1);
        setViewUiState();
        setCrosshairVisible(crosshairVisible);
        setSliceTool(SLICE_TOOL.NAVIGATE);
        await loadSubjectByIndex(0);
      } catch (e) {
        console.error(e);
        statusEl.textContent = "Could not connect to the FastReads VASC server. Start it with the launcher for this platform.";
      }
    }

    init();
  </script>
</body>
</html>
